<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        width: 100vw;
        height: 100vh;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>
<body>
<canvas id="atlasCanvas"></canvas>
<script>
(function(){
    var f = window.frameElement;
    if (f) {
        f.style.cssText =
            'position:fixed!important;top:0!important;left:0!important;' +
            'width:100vw!important;height:100vh!important;z-index:0!important;' +
            'pointer-events:none!important;border:none!important;background:transparent!important;';
    }

    var cv = document.getElementById('atlasCanvas');
    var ctx = cv.getContext('2d');
    var W = 0, H = 0;
    var dpr = window.devicePixelRatio || 1;

    function resize(){
        W = window.innerWidth;
        H = window.innerHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Anatomical section rings — like stained histological cross-sections
    // Slow, meditative drift anchored to two focal points
    var rings = [];
    var RING_COUNT = 7;

    // Two focal points: upper-right and lower-left (like Fibonacci spirals in cardiac anatomy)
    var foci = [
        { x: 0.78, y: 0.18 },
        { x: 0.22, y: 0.82 }
    ];

    for (var i = 0; i < RING_COUNT; i++) {
        var focal = foci[i % 2];
        rings.push({
            fx: focal.x,
            fy: focal.y,
            radius: 80 + i * 110,
            phase: (i / RING_COUNT) * Math.PI * 2,
            speed: 0.00006 + i * 0.000012,
            opacity: 0.028 - i * 0.0018,
            strokeWidth: 0.8 + (RING_COUNT - i) * 0.15
        });
    }

    // Fine meridian lines — like an anatomical atlas grid (not a telemetry grid)
    // Sparse, diagonal, very faint — like ruled manuscript paper
    function drawAtlasLines() {
        var lineSpacing = 60;
        ctx.strokeStyle = 'rgba(26, 31, 46, 0.028)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();

        // Horizontal ruled lines
        for (var y = 0; y < H; y += lineSpacing) {
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
        }
        ctx.stroke();

        // Single vertical margin line (left-aligned atlas layout)
        ctx.strokeStyle = 'rgba(139, 26, 74, 0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(32, 0);
        ctx.lineTo(32, H);
        ctx.stroke();
    }

    var t = 0;
    var lastTime = performance.now();

    function render(now) {
        var dt = (now - lastTime) / 1000;
        lastTime = now;
        t += dt;

        ctx.clearRect(0, 0, W, H);

        drawAtlasLines();

        // Draw anatomical section rings
        for (var i = 0; i < rings.length; i++) {
            var ring = rings[i];
            var phase = ring.phase + t * ring.speed * Math.PI * 2;

            // Focal point slowly drifts in a small ellipse (breathing motion)
            var breathX = ring.fx * W + Math.cos(phase * 0.7) * 18;
            var breathY = ring.fy * H + Math.sin(phase * 0.5) * 12;

            // Elliptical ring (anatomical cross-sections are never perfect circles)
            var rx = ring.radius;
            var ry = ring.radius * 0.72;
            var rotation = phase * 0.08;

            ctx.save();
            ctx.translate(breathX, breathY);
            ctx.rotate(rotation);
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(139, 26, 74, ' + Math.max(0, ring.opacity) + ')';
            ctx.lineWidth = ring.strokeWidth;
            ctx.stroke();
            ctx.restore();
        }

        // Burgundy gradient bloom at upper right (single warm radial wash)
        var grd = ctx.createRadialGradient(W * 0.85, H * 0.05, 0, W * 0.85, H * 0.05, W * 0.45);
        grd.addColorStop(0, 'rgba(139, 26, 74, 0.032)');
        grd.addColorStop(1, 'rgba(139, 26, 74, 0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);

        requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
})();
</script>
</body>
</html>
